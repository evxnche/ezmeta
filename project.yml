name: DeskPal
options:
  bundleIdPrefix: com.evancheriyan
  deploymentTarget:
    iOS: "17.2"
packages:
  MetaWearablesDAT:
    url: https://github.com/facebook/meta-wearables-dat-ios
    exactVersion: 1.0.1
targets:
  DeskPal:
    type: application
    platform: iOS
    sources: [DeskPal]
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.evancheriyan.deskpal
        DEVELOPMENT_TEAM: 6CZW66SUWK
        CODE_SIGN_STYLE: Automatic
        INFOPLIST_FILE: DeskPal/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        SWIFT_VERSION: "5.0"
        TARGETED_DEVICE_FAMILY: "1"
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
    dependencies:
      - package: MetaWearablesDAT
        product: MWDATCore
      - package: MetaWearablesDAT
        product: MWDATInputs
      - package: MetaWearablesDAT
        product: MWDATMotion
